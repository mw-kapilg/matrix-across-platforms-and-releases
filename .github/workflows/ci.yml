name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.release }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every failing release/platform combination, not just the first.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        release: [R2023b, R2024b, latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB ${{ matrix.release }}
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.release }}

      - name: Run tests
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: src
          select-by-folder: tests
          test-results-junit: test-results/results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.release }}-${{ matrix.os }}
          path: test-results/
